<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Timetable AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#ffffff);
color:#1f2937;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.logo{
font-size:20px;
font-weight:700;
color:#2563eb;
}

.menu{
display:flex;
gap:25px;
}

.menu a{
text-decoration:none;
color:#374151;
font-weight:500;
cursor:pointer;
}

/* GRID */
.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
padding:40px;
}

.card{
background:white;
border-radius:16px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.07);
}

/* INPUT */
input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #d1d5db;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

/* LIST */
ul{
list-style:none;
margin-top:10px;
}

li{
padding:10px;
margin-bottom:6px;
border-radius:8px;
color:white;
font-size:14px;
}

/* COLORS */
.event{
background:#2563eb;
}

.assignment{
background:#10b981;
}

.ai-box{
grid-column:1/3;
}

.reply{
margin-top:12px;
padding:12px;
background:#f3f4f6;
border-radius:10px;
}

</style>

</head>

<body>

<div class="navbar">
<div class="logo">📅 Smart Timetable AI</div>

<div class="menu">
<a>Home</a>
<a>Calendar</a>
<a>Assignments</a>
<a>AI Assistant</a>
</div>
</div>

<div class="container">

<!-- ADD EVENT -->

<div class="card">
<h3>Add Event</h3>

<input id="eventName" placeholder="Event Name">

<input type="date" id="eventDate">

<label>Start Time</label> <input type="time" id="startTime">

<label>End Time</label> <input type="time" id="endTime">

<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<button onclick="addEvent()">Add Event</button>

</div>

<!-- ADD ASSIGNMENT -->

<div class="card">
<h3>Add Assignment</h3>

<input id="name" placeholder="Assignment Name">
<input id="subject" placeholder="Subject">
<input id="deadline" type="date">

<button onclick="addAssignment()">Add Assignment</button> <button onclick="showAssignments()">Show Assignments</button>

</div>

<!-- CALENDAR -->

<div class="card">
<h3>Calendar</h3>
<ul id="calendar"></ul>
</div>

<!-- ASSIGNMENTS -->

<div class="card">
<h3>Assignments</h3>
<ul id="assignmentList"></ul>
</div>

<!-- AI -->

<div class="card ai-box">
<h3>AI Assistant</h3>

<input id="question" placeholder="Ask: free time today">
<button onclick="askAI()">Ask</button>

<div id="reply" class="reply"></div>
</div>

</div>

<script>

const API="http://localhost:3000";

/// ADD EVENT
async function addEvent(){

const name=document.getElementById("eventName").value;
const date=document.getElementById("eventDate").value;
const start=document.getElementById("startTime").value;
const end=document.getElementById("endTime").value;
const priority=document.getElementById("priority").value;

if(!name||!date||!start||!end){
alert("Please enter all event details");
return;
}

await fetch(API+"/addEvent",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name,date,start,end,priority
})
});

alert("Event Added");

loadCalendar();
}

/// ADD ASSIGNMENT
async function addAssignment(){

const data={
name:document.getElementById("name").value,
subject:document.getElementById("subject").value,
deadline:document.getElementById("deadline").value
};

if(!data.name||!data.deadline){
alert("Enter assignment details");
return;
}

await fetch(API+"/addAssignment",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

alert("Assignment Added");

loadCalendar();
}

/// SHOW ASSIGNMENTS
async function showAssignments(){

const res=await fetch(API+"/assignments");
const assignments=await res.json();

const list=document.getElementById("assignmentList");
list.innerHTML="";

assignments.forEach(a=>{
const li=document.createElement("li");
li.className="assignment";
li.textContent=`${a.name} - ${a.subject} (${a.deadline})`;
list.appendChild(li);
});
}

/// LOAD CALENDAR
async function loadCalendar(){

const res=await fetch(API+"/events");
const events=await res.json();

const cal=document.getElementById("calendar");
cal.innerHTML="";

events.forEach(e=>{
const li=document.createElement("li");
li.className="event";
li.textContent=`${e.title} | ${e.date} ${e.start}-${e.end}`;
cal.appendChild(li);
});
}

/// AI
async function askAI(){

const question=document.getElementById("question").value;

const res=await fetch(API+"/askAI",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question})
});

const data=await res.json();

document.getElementById("reply").innerText=data.reply;
}

loadCalendar();

</script>

</body>
</html>
